[package]
name = "md-view"
version = "0.1.0"
edition = "2021"
description = "A terminal Markdown renderer/previewer with phosphor-green theme"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
pulldown-cmark = "0.12"
clap = { version = "4", features = ["derive"] }
notify = "7"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
